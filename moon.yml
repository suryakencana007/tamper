$schema: 'https://moonrepo.dev/schemas/project.json'
layer: 'library'
language: 'go'

# The Tamper enterprise auth/authz framework. Module
# github.com/suryakencana007/barista/packages/tamper.
tasks:
  build:
    command: 'go'
    args: ['build', './...']
  test:
    command: 'go'
    # -race + explicit timeout to match barista:test conventions. This
    # target is CI-gating (ci.yml runs it alongside barista:ci) — the
    # tamper suites (crypto/audit/authz/identity) don't run under
    # barista:test, and packages Barista doesn't import yet (identity
    # until Phase 2b) wouldn't even COMPILE in CI without it.
    args: ['test', '-race', '-timeout=10m', './...']
  vet:
    command: 'go'
    args: ['vet', './...']
  # golangci-lint over the whole module. No `deps` (unlike barista:lint,
  # which needs web:build for the go:embed typecheck) — tamper embeds
  # nothing. Walks up to the repo-root .golangci.yaml, so tamper is
  # linted under the SAME curated rule set as Barista.
  #
  # This closes a real gap: tamper had test + vet in CI but never a lint
  # pass, so `unused`/staticcheck findings in a tamper package Barista
  # doesn't import were invisible — the exact blind spot that let 4d-4c's
  # orphans through (they were caught in Barista, where lint DID run).
  lint:
    command: 'golangci-lint'
    args: ['run', './...']
  # Regenerate the framework's sqlc code from packages/tamper/sqlc.yaml
  # (today: audit/sqlitestore only). Single-driver SQLite, so — unlike
  # Barista's scripts/sqlc-gen.sh — there is no //go:build tag re-injection
  # step; `sqlc generate` is the whole pipeline. Pin sqlc v1.30.0 to
  # reproduce the checked-in output byte-for-byte.
  #
  # NOT the CI drift-guard on its own (it rewrites files). The guard is
  # TestSchemaMigrationParity in the test target, which fails if schema.sql
  # and the runtime migrations diverge — regen-and-diff is the dev loop.
  sqlc:
    command: 'sqlc'
    args: ['generate']
