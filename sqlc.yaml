# sqlc config for the Tamper framework's generated stores.
#
# Today the only generated code in tamper is audit/sqlitestore (the
# SQLite-backed audit-log persistence layer). This block regenerates it
# from audit/sqlitestore/schema.sql + audit/sqlitestore/queries.
#
# History: this block used to live in Barista's apps/barista/sqlc.yaml (as
# the "sqliteaudit" block) but was removed when the audit store moved into
# the framework at packages/tamper/audit/sqlitestore. For a while there was
# NO generator wired here, so an audit-schema edit had no regen path — the
# gap flagged in apps/barista/sqlc.yaml and in TAMPER-DESIGN.md's Open items.
# This file closes it (Phase 6 slice 1).
#
# Single-driver (SQLite only): unlike Barista's dual sqlite+postgres blocks,
# the audit store is SQLite-only, so there is no //go:build tag re-injection
# to do after `sqlc generate` — the plain command below is the whole story.
#
# Reproduce byte-identically with sqlc v1.30.0 (the pinned toolchain
# version; the generated files carry `sqlc v1.30.0` in their headers).
# Regenerate + diff:
#     cd packages/tamper && sqlc generate && git diff --stat
# The diff must be empty; if it isn't, sqlc's parser tripped on a schema or
# query edit (see the sqlc-expert skill) — revert + investigate.
version: "2"
sql:
  - engine: "sqlite"
    schema: "audit/sqlitestore/schema.sql"
    queries: "audit/sqlitestore/queries"
    gen:
      go:
        package: "sqlitestore"
        out: "audit/sqlitestore"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: false
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_empty_slices: true
        # The v4 BLOB columns are NOT NULL with a DEFAULT that can never fire,
        # because sqlc names every column in the INSERT. Left as plain []byte,
        # a caller's zero-valued struct literal sends NULL and the insert
        # fails — and InsertEventParams is public API, so that caller is not
        # necessarily in this repo. Blob's driver.Valuer renders nil as x''.
        # See audit/sqlitestore/sqltypes/blob.go for the full reasoning.
        overrides:
          - column: "events.row_salt"
            go_type: "github.com/suryakencana007/tamper/audit/sqlitestore/sqltypes.Blob"
          - column: "events.c_actor_email"
            go_type: "github.com/suryakencana007/tamper/audit/sqlitestore/sqltypes.Blob"
          - column: "events.c_actor_name"
            go_type: "github.com/suryakencana007/tamper/audit/sqlitestore/sqltypes.Blob"
          - column: "events.c_actor_ip"
            go_type: "github.com/suryakencana007/tamper/audit/sqlitestore/sqltypes.Blob"
          - column: "events.c_before"
            go_type: "github.com/suryakencana007/tamper/audit/sqlitestore/sqltypes.Blob"
          - column: "events.c_after"
            go_type: "github.com/suryakencana007/tamper/audit/sqlitestore/sqltypes.Blob"
